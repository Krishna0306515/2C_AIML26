<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Eligibility</title>
</head>

<body>

<input type="button"
       value="Result"
       onclick="info()">

<script>
function info() {

    let age = parseInt(prompt("Enter your age"));

    if (age >= 18) {
        let c = confirm("Do you want to submit your vote");

        if (c) {
            alert("Your response submitted");
        } else {
            alert("Not submitted. Thank You!");
        }

    } else {
        alert("You are not eligible to vote.");
    }

}
</script>

</body>
</html>
