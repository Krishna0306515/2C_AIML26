<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAME EXAMPLE</title>
</head>

<body>

<input type="button"
       value="Display"
       onclick="Name()">

<script>
function F(fn){
    let FN=fn;
    return FN;
}
function L(ln){
    let LN=ln;
    return LN;
}
function Name(){
    let FirstName=F("Vikas");
    let LastName=L("Sharma");

document.write(FirstName+" "+LastName);
}
</script>

</body>
</html>
